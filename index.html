<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEMA FOX - الرئيسية</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #2b0509;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #8b0000;
            padding-bottom: 15px;
        }

        .logo-container {
            width: 100%;
            max-width: 250px;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.7));
        }

        p.subtitle {
            color: #ffcccc;
            margin: 0 0 15px 0;
            font-size: 14px;
        }

        .search-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            position: relative;
        }

        .search-input {
            width: 100%;
            background-color: #1a0002;
            border: 1px solid #8b0000;
            color: #ffffff;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            text-align: right;
        }

        .search-input::placeholder {
            color: #b3888b;
        }

        .search-input:focus {
            border-color: #ff0033;
            box-shadow: 0 0 8px rgba(255, 0, 51, 0.4);
        }

        .grid-container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: #1a0002;
            border: 1px solid #8b0000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(139, 0, 0, 0.4);
        }

        .card-img {
            width: 100%;
            aspect-ratio: 2/3;
            background-color: #330005;
            object-fit: cover;
        }

        .card-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            margin: 0 0 8px 0;
            color: #ffffff;
        }

        .card-btn {
            background-color: #8b0000;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
        }

        .card-btn:hover {
            background-color: #a91111;
        }

        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            color: #ffcccc;
            font-size: 16px;
            padding: 30px;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .logo-container { max-width: 180px; }
            .search-container { max-width: 100%; }
            .grid-container { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .card-title { font-size: 14px; }
            .card-btn { font-size: 12px; padding: 6px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo_cinemafox.png" alt="CINEMA FOX">
        </div>
        <p class="subtitle">منصتك المفضلة لمشاهدة أحدث الأعمال والمسلسلات</p>
        
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن مسلسل (بالعربي أو الإنجليزي)..." oninput="filterDramas()">
        </div>
    </header>

    <div class="grid-container" id="dramasGrid">
        <!-- يتم تعبئة المسلسلات ديناميكياً من ملف cinemafox.js -->
    </div>

    <!-- ربط ملف البيانات مع إضافة كاش-بستر (v=1) حتى المتصفح يضمن قراءة التحديثات الجديدة -->
    <script src="cinemafox.js?v=1"></script>

    <script>
        let allDramas = [];

        window.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('dramasGrid');

            // فحص دقيق لضمان التعرف الكامل على المتغير من ملف cinemafox.js
            if (typeof dramasData !== 'undefined' && dramasData.dramas && Array.isArray(dramasData.dramas)) {
                allDramas = dramasData.dramas;
                displayDramas(allDramas);
            } else {
                console.error("خطأ: لم يتم التعرف على ملف cinemafox.js أو أن هيكل البيانات غير صحيح!");
                grid.innerHTML = '<p class="no-results">عذراً، تعذر تحميل البيانات من ملف cinemafox.js. تأكد من صحة الأقواس وهيكل الملف.</p>';
            }
        });

        function displayDramas(dramas) {
            const grid = document.getElementById('dramasGrid');
            grid.innerHTML = '';

            if (dramas.length === 0) {
                grid.innerHTML = '<p class="no-results">عذراً، لم يتم العثور على نتائج مطابقة لبحثك.</p>';
                return;
            }

            dramas.forEach(drama => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => {
                    window.location.href = `watch.html?id=${encodeURIComponent(drama.id)}`;
                };

                card.innerHTML = `
                    <img class="card-img" src="${drama.poster || 'placeholder.jpg'}" alt="${drama.title}">
                    <div class="card-content">
                        <h3 class="card-title">${drama.title}</h3>
                        <a href="watch.html?id=${encodeURIComponent(drama.id)}" class="card-btn">مشاهدة الآن</a>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function filterDramas() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            
            if (!query) {
                displayDramas(allDramas);
                return;
            }

            const filtered = allDramas.filter(drama => {
                const titleAr = drama.title ? drama.title.toLowerCase() : '';
                const titleEn = drama.id ? drama.id.toLowerCase() : '';
                return titleAr.includes(query) || titleEn.includes(query);
            });

            displayDramas(filtered);
        }
    </script>
</body>
</html>
